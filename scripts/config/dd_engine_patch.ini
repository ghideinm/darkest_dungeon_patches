; Read once at startup. Restart the game after editing.
[memory]
; MiB per resource-reading buffer. Default: 32.
resource_buffer_mib=32
; Initial number of slots in each skin/class cache; it keeps growing as needed.
cache_initial_capacity=16

[logging]
; 0: debug output only. 1: also append patch diagnostics to a file.
log_to_file=0
; Relative to this configuration file, or an absolute UTF-8 path.
log_file=dd_engine_patch.log
