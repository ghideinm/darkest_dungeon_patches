[project]
name = "darkest-dungeon-patches"
version = "1.0.0"
description = "Build and deployment tools for native Darkest Dungeon patches"
requires-python = ">=3.10"
dependencies = []

[tool.uv]
package = false

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]
